# Installs the provider from the Upbound registry. While the repository is
# private, create the pull secret first (see README.md in this directory).
# The ghcr.io copy of the package is org-internal and cannot be made public,
# so Upbound is the only registry an outside user can pull from.
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-azure-adx
spec:
  package: xpkg.upbound.io/functional-team/provider-azure-adx:v0.1.0-rc.5
  packagePullSecrets:
    - name: upbound-functional-team
