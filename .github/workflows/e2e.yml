name: E2E

# End-to-end tests against a real development cluster (docs/tech-implement.md,
# section 11.3). Runs nightly and on demand. Authentication uses OIDC
# federation on a service principal with AllDatabasesAdmin on the dev cluster;
# no long-lived secret lives in the repository.
on:
  workflow_dispatch:
    inputs:
      timeout:
        description: 'uptest per-resource timeout (e.g. 300s for a quick diagnostic run)'
        required: false
        default: '1800s'
  schedule:
    - cron: '0 2 * * *'

permissions:
  id-token: write
  contents: read

env:
  GO_VERSION: '1.25.0'
  CROSSPLANE_VERSION: '2.0.2'

jobs:
  e2e:
    # Skipped until ADX_E2E_ENABLED is set (test/e2e/README.md). The actual
    # cluster name/URI/resource group/database are secrets, not variables, so
    # they don't show up in plaintext to anyone with Actions-settings access
    # -- but a job-level `if:` cannot reference the secrets context at all
    # ("Unrecognized named-value: 'secrets'"), so gating needs a separate,
    # non-sensitive variable instead of checking one of the secrets directly.
    if: vars.ADX_E2E_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Fetch History
        run: git fetch --prune --unshallow
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # A start collides with a stop that is still settling: Azure refuses with
      # "provisioning state is not terminal". The cluster's state and its ARM
      # provisioningState are separate axes -- a cluster can read Stopped while
      # provisioningState is still "Running", meaning an operation is in
      # flight. Wait for a terminal provisioningState, then start.
      - name: Start dev cluster
        env:
          NAME: ${{ secrets.ADX_E2E_CLUSTER_NAME }}
          RG: ${{ secrets.ADX_E2E_RESOURCE_GROUP }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            prov=$(az kusto cluster show --name "$NAME" --resource-group "$RG" --query provisioningState -o tsv)
            case "$prov" in
              Succeeded|Failed|Canceled) break ;;
            esac
            echo "provisioningState=$prov, waiting"
            sleep 20
          done
          az kusto cluster start --name "$NAME" --resource-group "$RG"
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true
      # Must run before make e2e: uptest snapshots the examples before it calls
      # the setup script, so rewriting from there is too late.
      - name: Point examples at the dev environment
        env:
          ADX_E2E_DATABASE: ${{ secrets.ADX_E2E_DATABASE }}
          ADX_E2E_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ADX_E2E_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ADX_E2E_STORAGE_ACCOUNT: ${{ secrets.ADX_E2E_STORAGE_ACCOUNT }}
          ADX_E2E_STORAGE_SAS: ${{ secrets.ADX_E2E_STORAGE_SAS }}
        run: ./test/e2e/rewrite-examples.sh
      # make e2e = build + kind cluster with Crossplane + local provider deploy
      # + uptest over examples/. setup.sh creates the ProviderConfig from the
      # ADX_E2E_* variables (test/e2e/README.md).
      - name: Run e2e (build, kind, deploy, uptest)
        env:
          BUILD_ARGS: "--load"
          UPTEST_DEFAULT_TIMEOUT: ${{ inputs.timeout || '1800s' }}
          ADX_E2E_CLUSTER_URI: ${{ secrets.ADX_E2E_CLUSTER_URI }}
          ADX_E2E_DATABASE: ${{ secrets.ADX_E2E_DATABASE }}
          ADX_E2E_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ADX_E2E_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ADX_E2E_CLIENT_SECRET: ${{ secrets.ADX_E2E_CLIENT_SECRET }}
        run: make e2e
      # Printed into the job log rather than only dumped to disk: a failing run
      # is useless to debug afterwards because the runner (and with it the kind
      # cluster) is gone. "get managed" answers the first question every time --
      # is one kind stuck or all of them?
      - name: Provider diagnostics
        if: failure()
        run: |
          KUBECTL="$(ls .cache/tools/*/kubectl-* 2>/dev/null | head -1 || true)"
          [ -x "$KUBECTL" ] || KUBECTL=kubectl
          echo "::group::Managed resources (READY/SYNCED)"
          $KUBECTL get managed -A || true
          echo "::endgroup::"
          echo "::group::Pods in crossplane-system"
          $KUBECTL -n crossplane-system get pods -o wide || true
          echo "::endgroup::"
          echo "::group::Provider package and revision"
          $KUBECTL get providers.pkg.crossplane.io,providerrevisions.pkg.crossplane.io -o wide || true
          echo "::endgroup::"
          echo "::group::CRDs: Established condition"
          $KUBECTL get crd -o json \
            | jq -r '.items[] | select(.spec.group | test("adx[.]functional[.]team")) | [.metadata.name, (.status.conditions[]? | select(.type == "Established") | .status), .metadata.creationTimestamp] | @tsv' || true
          echo "::endgroup::"
          echo "::group::Provider logs"
          $KUBECTL -n crossplane-system logs -l pkg.crossplane.io/provider=provider-azure-adx \
            --tail=2000 --all-containers --prefix --ignore-errors || true
          echo "::endgroup::"
          echo "::group::EntityGroup telemetry-sources"
          $KUBECTL -n data-platform get entitygroup telemetry-sources -o yaml || true
          echo "::endgroup::"
      - name: Collect diagnostics
        if: failure()
        run: make controlplane.dump || true
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: controlplane-dump
          path: _output/controlplane-dump
          retention-days: 7
          if-no-files-found: warn
      - name: Stop dev cluster
        if: always()
        run: |
          az kusto cluster stop --name "${{ secrets.ADX_E2E_CLUSTER_NAME }}" --resource-group "${{ secrets.ADX_E2E_RESOURCE_GROUP }}" --no-wait || true
