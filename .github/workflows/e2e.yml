name: E2E

# End-to-end tests against a real development cluster (docs/tech-implement.md,
# section 11.3). Runs nightly and on demand. Authentication uses OIDC
# federation on a service principal with AllDatabasesAdmin on the dev cluster;
# no long-lived secret lives in the repository.
on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 2 * * *'

permissions:
  id-token: write
  contents: read

env:
  GO_VERSION: '1.25.0'
  CROSSPLANE_VERSION: '2.0.2'

jobs:
  e2e:
    # Skipped until the Azure variables exist (test/e2e/README.md).
    if: vars.ADX_E2E_CLUSTER_URI != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Fetch History
        run: git fetch --prune --unshallow
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Start dev cluster
        run: |
          az kusto cluster start --name "${{ vars.ADX_E2E_CLUSTER_NAME }}" --resource-group "${{ vars.ADX_E2E_RESOURCE_GROUP }}"
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true
      # make e2e = build + kind cluster with Crossplane + local provider deploy
      # + uptest over examples/. setup.sh creates the ProviderConfig from the
      # ADX_E2E_* variables (test/e2e/README.md).
      - name: Run e2e (build, kind, deploy, uptest)
        env:
          BUILD_ARGS: "--load"
          ADX_E2E_CLUSTER_URI: ${{ vars.ADX_E2E_CLUSTER_URI }}
          ADX_E2E_DATABASE: ${{ vars.ADX_E2E_DATABASE }}
          ADX_E2E_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ADX_E2E_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ADX_E2E_CLIENT_SECRET: ${{ secrets.ADX_E2E_CLIENT_SECRET }}
        run: make e2e
      - name: Collect diagnostics
        if: failure()
        run: make controlplane.dump || true
      - name: Stop dev cluster
        if: always()
        run: |
          az kusto cluster stop --name "${{ vars.ADX_E2E_CLUSTER_NAME }}" --resource-group "${{ vars.ADX_E2E_RESOURCE_GROUP }}" --no-wait || true
