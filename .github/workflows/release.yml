name: Release

# Tag v* -> provider image and xpkg pushed to ghcr.io/functional-team. After the
# move to crossplane-contrib the package is additionally published to
# xpkg.crossplane.io/crossplane-contrib by adding it to XPKG_REG_ORGS.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  GO_VERSION: '1.25.0'
  DOCKER_BUILDX_VERSION: 'v0.23.0'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: ${{ env.DOCKER_BUILDX_VERSION }}
          install: true
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Fetch History
        run: git fetch --prune --unshallow
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Download Go Modules
        run: make modules.download modules.check
      - name: Build Artifacts
        run: make -j2 build.all
        env:
          BUILD_ARGS: "--load"
      # The build makelib only publishes for BRANCH_NAME main/master/release-*;
      # on a tag push GITHUB_REF names the tag, so the branch is set explicitly.
      - name: Publish Artifacts
        run: make publish BRANCH_NAME=main
      - name: Verify package in registry
        run: docker buildx imagetools inspect ghcr.io/functional-team/provider-azure-adx:${GITHUB_REF_NAME}
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: output
          path: _output/**
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc') }}
