name: Release

# Tag v* -> provider image and xpkg pushed to ghcr.io/functional-team. After the
# move to crossplane-contrib the package is additionally published to
# xpkg.crossplane.io/crossplane-contrib by adding it to XPKG_REG_ORGS.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  GO_VERSION: '1.25.0'
  DOCKER_BUILDX_VERSION: 'v0.23.0'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Setup QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: all
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: ${{ env.DOCKER_BUILDX_VERSION }}
          install: true
      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Pushing to the Upbound Marketplace registry needs a robot token; a
      # personal API token answers 401. The robot must also sit in a team with
      # write permission on the repository. Gated on a variable rather than on
      # the secret, because a job-level if: cannot read the secrets context.
      - name: Login to Upbound
        if: vars.UPBOUND_PUBLISH == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: xpkg.upbound.io
          username: ${{ secrets.UPBOUND_ROBOT_ACCESS_ID }}
          password: ${{ secrets.UPBOUND_ROBOT_TOKEN }}
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: true
      - name: Fetch History
        run: git fetch --prune --unshallow
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Download Go Modules
        run: make modules.download modules.check
      - name: Build Artifacts
        run: make -j2 build.all
        env:
          BUILD_ARGS: "--load"
      # The build makelib only publishes for BRANCH_NAME main/master/release-*;
      # on a tag push GITHUB_REF names the tag, so the branch is set explicitly.
      # XPKG_REG_ORGS is ?= in the Makefile, so this wins. Both registries get
      # every tag; the Upbound one is what the Marketplace lists.
      - name: Publish Artifacts
        env:
          XPKG_REG_ORGS: ${{ vars.UPBOUND_PUBLISH == 'true' && 'xpkg.upbound.io/functional-team ghcr.io/functional-team' || 'ghcr.io/functional-team' }}
        run: make publish BRANCH_NAME=main
      # A silent no-push already happened once (v0.1.0-rc.1 built everything and
      # pushed nothing), so every target registry is inspected, not assumed.
      - name: Verify package in registry
        run: docker buildx imagetools inspect ghcr.io/functional-team/provider-azure-adx:${GITHUB_REF_NAME}
      - name: Verify package in the Upbound registry
        if: vars.UPBOUND_PUBLISH == 'true'
        run: docker buildx imagetools inspect xpkg.upbound.io/functional-team/provider-azure-adx:${GITHUB_REF_NAME}
      # The package icon is not part of the xpkg: the Marketplace reads it from
      # extension layers that are appended to the pushed version afterwards.
      # See docs/marketplace-extensions.md. It authenticates through the docker
      # config that docker/login-action wrote above; `up login` would be the
      # fallback. It only touches xpkg.upbound.io -- the GHCR copy has no
      # extensions -- and it rewrites the tag, so the digest changes.
      - name: Install the up CLI
        if: vars.UPBOUND_PUBLISH == 'true'
        run: |
          set -euo pipefail
          curl -sL https://cli.upbound.io | sh
          sudo mv up /usr/local/bin/up
          up version
      - name: Append the Marketplace extensions
        if: vars.UPBOUND_PUBLISH == 'true'
        run: |
          set -euo pipefail
          ref=xpkg.upbound.io/functional-team/provider-azure-adx:${GITHUB_REF_NAME}
          up alpha xpkg append --extensions-root=./extensions "$ref"
          # The extensions arrive as one more manifest in the image index,
          # next to linux/amd64 and linux/arm64 but without a platform. Print
          # what actually landed and fail if it is not there: "the step exited
          # 0" is not evidence that the icon reached the registry, and there is
          # no listing page to look at while the repository is unpublished.
          raw=$(docker buildx imagetools inspect --raw "$ref")
          echo "$raw" | jq '.manifests[] | {digest, mediaType, artifactType, platform, annotations}'
          if [ "$(echo "$raw" | jq '[.manifests[] | select((.platform.os // "unknown") == "unknown")] | length')" -lt 1 ]; then
            echo "no extension manifest in the index -- the icon did not land" >&2
            exit 1
          fi
      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc') }}
