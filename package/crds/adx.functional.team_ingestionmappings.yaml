---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: ingestionmappings.adx.functional.team
spec:
  group: adx.functional.team
  names:
    categories:
    - crossplane
    - managed
    - adx
    kind: IngestionMapping
    listKind: IngestionMappingList
    plural: ingestionmappings
    singular: ingestionmapping
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - jsonPath: .metadata.annotations.crossplane\.io/external-name
      name: EXTERNAL-NAME
      type: string
    - jsonPath: .spec.forProvider.database
      name: DATABASE
      type: string
    - jsonPath: .spec.forProvider.table
      name: TABLE
      type: string
    - jsonPath: .spec.forProvider.kind
      name: KIND
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          An IngestionMapping is a pre-created ingestion mapping of a table. Its
          identity is (database, table, kind, name).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: An IngestionMappingSpec defines the desired state of an IngestionMapping.
            properties:
              forProvider:
                description: IngestionMappingParameters are the configurable fields
                  of an IngestionMapping.
                properties:
                  database:
                    description: Database that holds the table. Immutable.
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: database is immutable
                      rule: self == oldSelf
                  kind:
                    description: Kind is the data format of the mapping. Immutable.
                    enum:
                    - csv
                    - json
                    - avro
                    - apacheavro
                    - parquet
                    - orc
                    - w3clogfile
                    type: string
                    x-kubernetes-validations:
                    - message: kind is immutable
                      rule: self == oldSelf
                  mapping:
                    description: Mapping is the ordered list of column mappings.
                    items:
                      description: IngestionMappingColumn maps one source field to
                        a table column.
                      properties:
                        column:
                          description: Column is the target column of the table.
                          minLength: 1
                          type: string
                        dataType:
                          description: |-
                            DataType of the target column. Optional; Kusto derives it from the
                            table when omitted.
                          enum:
                          - bool
                          - boolean
                          - datetime
                          - date
                          - dynamic
                          - guid
                          - uuid
                          - uniqueid
                          - int
                          - long
                          - real
                          - double
                          - decimal
                          - string
                          - timespan
                          - time
                          type: string
                        properties:
                          additionalProperties:
                            type: string
                          description: |-
                            Properties are the format specific mapping properties, e.g. path
                            ("$.ts"), transform, ordinal, constValue or field. Keys are case
                            insensitive and written to Kusto with an upper-case first letter.
                          type: object
                      required:
                      - column
                      type: object
                    minItems: 1
                    type: array
                  name:
                    description: |-
                      Name of the mapping in Kusto. Written to the crossplane.io/external-name
                      annotation on the first reconcile if that annotation is empty. Immutable.
                    maxLength: 1024
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: name is immutable
                      rule: self == oldSelf
                  table:
                    description: Table the mapping belongs to. Immutable once set.
                    type: string
                    x-kubernetes-validations:
                    - message: table is immutable
                      rule: self == oldSelf
                  tableRef:
                    description: TableRef references a Table managed resource.
                    properties:
                      name:
                        description: Name of the referenced object.
                        type: string
                      namespace:
                        description: Namespace of the referenced object
                        type: string
                      policy:
                        description: Policies for referencing.
                        properties:
                          resolution:
                            default: Required
                            description: |-
                              Resolution specifies whether resolution of this reference is required.
                              The default is 'Required', which means the reconcile will fail if the
                              reference cannot be resolved. 'Optional' means this reference will be
                              a no-op if it cannot be resolved.
                            enum:
                            - Required
                            - Optional
                            type: string
                          resolve:
                            description: |-
                              Resolve specifies when this reference should be resolved. The default
                              is 'IfNotPresent', which will attempt to resolve the reference only when
                              the corresponding field is not present. Use 'Always' to resolve the
                              reference on every reconcile.
                            enum:
                            - Always
                            - IfNotPresent
                            type: string
                        type: object
                    required:
                    - name
                    type: object
                  tableSelector:
                    description: TableSelector selects a Table managed resource.
                    properties:
                      matchControllerRef:
                        description: |-
                          MatchControllerRef ensures an object with the same controller reference
                          as the selecting object is selected.
                        type: boolean
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: MatchLabels ensures an object with matching labels
                          is selected.
                        type: object
                      namespace:
                        description: Namespace for the selector
                        type: string
                      policy:
                        description: Policies for selection.
                        properties:
                          resolution:
                            default: Required
                            description: |-
                              Resolution specifies whether resolution of this reference is required.
                              The default is 'Required', which means the reconcile will fail if the
                              reference cannot be resolved. 'Optional' means this reference will be
                              a no-op if it cannot be resolved.
                            enum:
                            - Required
                            - Optional
                            type: string
                          resolve:
                            description: |-
                              Resolve specifies when this reference should be resolved. The default
                              is 'IfNotPresent', which will attempt to resolve the reference only when
                              the corresponding field is not present. Use 'Always' to resolve the
                              reference on every reconcile.
                            enum:
                            - Always
                            - IfNotPresent
                            type: string
                        type: object
                    type: object
                required:
                - database
                - kind
                - mapping
                type: object
                x-kubernetes-validations:
                - message: table, tableRef or tableSelector is required
                  rule: has(self.table) || has(self.tableRef) || has(self.tableSelector)
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  kind: ClusterProviderConfig
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  kind:
                    description: Kind of the referenced object.
                    type: string
                  name:
                    description: Name of the referenced object.
                    type: string
                required:
                - kind
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                required:
                - name
                type: object
            required:
            - forProvider
            type: object
          status:
            description: An IngestionMappingStatus represents the observed state of
              an IngestionMapping.
            properties:
              atProvider:
                description: IngestionMappingObservation are the observable fields
                  of an IngestionMapping.
                properties:
                  kind:
                    description: Kind as reported by the cluster.
                    type: string
                  lastUpdatedOn:
                    description: LastUpdatedOn as reported by the cluster.
                    type: string
                  mapping:
                    description: Mapping is the mapping JSON as reported by the cluster.
                    type: string
                  table:
                    description: Table as reported by the cluster.
                    type: string
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastHandledReconcileAt:
                description: |-
                  LastHandledReconcileAt holds the value of the most recent
                  reconcile-requested-at annotation token that the controller has
                  processed. Users can compare this to the annotation to determine
                  whether a reconcile request has been handled.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
