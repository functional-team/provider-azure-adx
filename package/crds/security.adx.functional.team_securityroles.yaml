---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: securityroles.security.adx.functional.team
spec:
  group: security.adx.functional.team
  names:
    categories:
    - crossplane
    - managed
    - adx
    kind: SecurityRole
    listKind: SecurityRoleList
    plural: securityroles
    singular: securityrole
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - jsonPath: .spec.forProvider.database
      name: DATABASE
      type: string
    - jsonPath: .spec.forProvider.entity.kind
      name: ENTITY-KIND
      type: string
    - jsonPath: .spec.forProvider.entity.name
      name: ENTITY
      type: string
    - jsonPath: .spec.forProvider.role
      name: ROLE
      type: string
    - jsonPath: .spec.forProvider.mode
      name: MODE
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          A SecurityRole assigns principals to a role of a database, table, external
          table, materialized view or function. Deleting an Authoritative resource
          removes all principals of that role; deleting an Additive one removes only
          the principals it added.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: A SecurityRoleSpec defines the desired state of a SecurityRole.
            properties:
              forProvider:
                description: SecurityRoleParameters are the configurable fields of
                  a SecurityRole.
                properties:
                  database:
                    description: Database that holds the entity. Immutable.
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: database is immutable
                      rule: self == oldSelf
                  description:
                    description: Description recorded with the role assignment.
                    type: string
                  entity:
                    description: |-
                      Entity the role belongs to: Database, Table, ExternalTable,
                      MaterializedView or Function.
                    properties:
                      kind:
                        description: Kind of the target entity.
                        enum:
                        - Database
                        - Table
                        - MaterializedView
                        - ExternalTable
                        - Function
                        type: string
                      name:
                        description: Name of the target entity (Kusto name). Ignored
                          for kind Database.
                        type: string
                      nameRef:
                        description: |-
                          NameRef references a managed resource whose external name is used as
                          the target. The referenced kind follows from kind.
                        properties:
                          name:
                            description: Name of the referenced object.
                            type: string
                          namespace:
                            description: Namespace of the referenced object
                            type: string
                          policy:
                            description: Policies for referencing.
                            properties:
                              resolution:
                                default: Required
                                description: |-
                                  Resolution specifies whether resolution of this reference is required.
                                  The default is 'Required', which means the reconcile will fail if the
                                  reference cannot be resolved. 'Optional' means this reference will be
                                  a no-op if it cannot be resolved.
                                enum:
                                - Required
                                - Optional
                                type: string
                              resolve:
                                description: |-
                                  Resolve specifies when this reference should be resolved. The default
                                  is 'IfNotPresent', which will attempt to resolve the reference only when
                                  the corresponding field is not present. Use 'Always' to resolve the
                                  reference on every reconcile.
                                enum:
                                - Always
                                - IfNotPresent
                                type: string
                            type: object
                        required:
                        - name
                        type: object
                      nameSelector:
                        description: |-
                          NameSelector selects a managed resource whose external name is used as
                          the target. The selected kind follows from kind.
                        properties:
                          matchControllerRef:
                            description: |-
                              MatchControllerRef ensures an object with the same controller reference
                              as the selecting object is selected.
                            type: boolean
                          matchLabels:
                            additionalProperties:
                              type: string
                            description: MatchLabels ensures an object with matching
                              labels is selected.
                            type: object
                          namespace:
                            description: Namespace for the selector
                            type: string
                          policy:
                            description: Policies for selection.
                            properties:
                              resolution:
                                default: Required
                                description: |-
                                  Resolution specifies whether resolution of this reference is required.
                                  The default is 'Required', which means the reconcile will fail if the
                                  reference cannot be resolved. 'Optional' means this reference will be
                                  a no-op if it cannot be resolved.
                                enum:
                                - Required
                                - Optional
                                type: string
                              resolve:
                                description: |-
                                  Resolve specifies when this reference should be resolved. The default
                                  is 'IfNotPresent', which will attempt to resolve the reference only when
                                  the corresponding field is not present. Use 'Always' to resolve the
                                  reference on every reconcile.
                                enum:
                                - Always
                                - IfNotPresent
                                type: string
                            type: object
                        type: object
                    required:
                    - kind
                    type: object
                    x-kubernetes-validations:
                    - message: name, nameRef or nameSelector is required unless kind
                        is Database
                      rule: self.kind == 'Database' || has(self.name) || has(self.nameRef)
                        || has(self.nameSelector)
                  mode:
                    default: Authoritative
                    description: |-
                      Mode is Authoritative (default; the spec is the complete principal
                      list of the role) or Additive (only the listed principals are managed).
                    enum:
                    - Authoritative
                    - Additive
                    type: string
                  principals:
                    description: |-
                      Principals in Kusto notation, e.g. "aaduser=alice@contoso.com",
                      "aadapp=<appId>;<tenantId>", "aadgroup=<objectId>;<tenantId>". An empty
                      list in Authoritative mode removes every principal from the role.
                    items:
                      description: |-
                        Principal is a Kusto principal in FQN notation, e.g.
                        "aaduser=alice@contoso.com", "aadapp=<appId>;<tenantId>" or
                        "aadgroup=<name-or-objectId>;<tenantId>".
                      minLength: 1
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  role:
                    description: Role to manage. Immutable.
                    enum:
                    - admins
                    - users
                    - viewers
                    - unrestrictedviewers
                    - ingestors
                    - monitors
                    type: string
                    x-kubernetes-validations:
                    - message: role is immutable
                      rule: self == oldSelf
                required:
                - database
                - entity
                - role
                type: object
                x-kubernetes-validations:
                - message: tables only have the admins and ingestors roles
                  rule: self.entity.kind != 'Table' || self.role in ['admins','ingestors']
                - message: external tables, materialized views and functions only
                    have the admins role
                  rule: '!(self.entity.kind in [''ExternalTable'',''MaterializedView'',''Function''])
                    || self.role == ''admins'''
                - message: entity.kind is immutable
                  rule: self.entity.kind == oldSelf.entity.kind
                - message: entity.name is immutable once set
                  rule: '!has(oldSelf.entity.name) || !has(self.entity.name) || self.entity.name
                    == oldSelf.entity.name'
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  kind: ClusterProviderConfig
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  kind:
                    description: Kind of the referenced object.
                    type: string
                  name:
                    description: Name of the referenced object.
                    type: string
                required:
                - kind
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                required:
                - name
                type: object
            required:
            - forProvider
            type: object
          status:
            description: A SecurityRoleStatus represents the observed state of a SecurityRole.
            properties:
              atProvider:
                description: SecurityRoleObservation are the observable fields of
                  a SecurityRole.
                properties:
                  principals:
                    description: Principals are the FQNs currently assigned to the
                      role in the cluster.
                    items:
                      type: string
                    type: array
                  resolvedPrincipals:
                    description: |-
                      ResolvedPrincipals maps spec entries to the object ids Kusto reports.
                      The provider compares sets of object ids, so the notation used in the
                      spec (UPN, app id, object id) does not matter.
                    items:
                      description: ResolvedPrincipal maps one spec entry to the principal
                        Kusto reports.
                      properties:
                        displayName:
                          description: DisplayName Kusto reports.
                          type: string
                        fqn:
                          description: FQN is the fully qualified principal name Kusto
                            reports.
                          type: string
                        objectId:
                          description: ObjectID is the Entra object id Kusto reports
                            for it.
                          type: string
                        spec:
                          description: Spec is the principal string from the spec.
                          type: string
                        type:
                          description: Type of the principal as reported (e.g. AAD
                            User).
                          type: string
                      required:
                      - objectId
                      - spec
                      type: object
                    type: array
                  unresolved:
                    description: |-
                      Unresolved lists spec entries that could not be mapped to a principal
                      reported by the cluster (see the provider documentation).
                    items:
                      type: string
                    type: array
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastHandledReconcileAt:
                description: |-
                  LastHandledReconcileAt holds the value of the most recent
                  reconcile-requested-at annotation token that the controller has
                  processed. Users can compare this to the annotation to determine
                  whether a reconcile request has been handled.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
