apiVersion: cluster.adx.functional.team/v1alpha1
kind: SandboxPolicy
metadata:
  name: sandbox
  namespace: data-platform
spec:
  forProvider:
    sandboxes:
      - sandboxKind: PythonExecution
        initializeOnStartup: false
        # Without isEnabled the sandboxes stay off: Kusto defaults it to false.
        isEnabled: true
        targetCountPerNode: 16
        maxCpuRatePerSandbox: 50
        maxMemoryMbPerSandbox: 10240
  providerConfigRef:
    kind: ProviderConfig
    name: telemetry-prod
