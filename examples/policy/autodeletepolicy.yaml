# The table the policy applies to. Kusto rejects a policy on a table that does
# not exist, so the example carries its own prerequisite.
apiVersion: adx.functional.team/v1alpha1
kind: Table
metadata:
  name: staging-events
  namespace: data-platform
  annotations:
    crossplane.io/external-name: StagingEvents
spec:
  forProvider:
    database: Telemetry
    columns:
      - name: Timestamp
        type: datetime
      - name: Payload
        type: dynamic
    folder: Staging
    docstring: Short lived staging area, emptied by the auto delete policy
  providerConfigRef:
    kind: ProviderConfig
    name: telemetry-prod
---
apiVersion: policy.adx.functional.team/v1alpha1
kind: AutoDeletePolicy
metadata:
  name: staging-autodelete
  namespace: data-platform
spec:
  forProvider:
    database: Telemetry
    entity:
      kind: Table
      name: StagingEvents
    expiryDate: "2030-01-01"
    deleteIfNotEmpty: true
  providerConfigRef:
    kind: ProviderConfig
    name: telemetry-prod
