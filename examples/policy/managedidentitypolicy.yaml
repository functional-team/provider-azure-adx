apiVersion: policy.adx.functional.team/v1alpha1
kind: ManagedIdentityPolicy
metadata:
  name: telemetry-managed-identity
  namespace: data-platform
spec:
  forProvider:
    database: Telemetry
    entity:
      kind: Database
    identities:
      - objectId: system
        allowedUsages:
          - NativeIngestion
          - ExternalTable
          # Continuous exports that authenticate as the cluster identity need
          # this; without it the export fails to start.
          - AutomatedFlows
  providerConfigRef:
    kind: ProviderConfig
    name: telemetry-prod
