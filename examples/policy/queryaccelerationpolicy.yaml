apiVersion: policy.adx.functional.team/v1alpha1
kind: QueryAccelerationPolicy
metadata:
  name: exports-acceleration
  namespace: data-platform
spec:
  forProvider:
    database: Telemetry
    entity:
      kind: ExternalTable
      name: ExportsDelta
    enabled: true
    hot: 1d
  providerConfigRef:
    kind: ProviderConfig
    name: telemetry-prod
