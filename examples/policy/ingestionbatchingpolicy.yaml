apiVersion: policy.adx.functional.team/v1alpha1
kind: IngestionBatchingPolicy
metadata:
  name: telemetry-batching
  namespace: data-platform
spec:
  forProvider:
    database: Telemetry
    entity:
      kind: Database
    maximumBatchingTimeSpan: 30s
    maximumNumberOfItems: 500
    maximumRawDataSizeMB: 1024
  providerConfigRef:
    kind: ProviderConfig
    name: telemetry-prod
