apiVersion: policy.adx.functional.team/v1alpha1
kind: StreamingIngestionPolicy
metadata:
  name: raw-events-streaming
  namespace: data-platform
spec:
  forProvider:
    database: Telemetry
    entity:
      kind: Table
      name: RawEvents
    enabled: true
  providerConfigRef:
    kind: ProviderConfig
    name: telemetry-prod
