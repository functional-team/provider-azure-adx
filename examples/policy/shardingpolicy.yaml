apiVersion: policy.adx.functional.team/v1alpha1
kind: ShardingPolicy
metadata:
  name: raw-events-sharding
  namespace: data-platform
spec:
  forProvider:
    database: Telemetry
    entity:
      kind: Table
      name: RawEvents
    # The service reports and accepts only the ShardEngine* names; the
    # unprefixed ones are silently ignored.
    shardEngineMaxRowCount: 750000
    shardEngineMaxExtentSizeInMb: 1024
  providerConfigRef:
    kind: ProviderConfig
    name: telemetry-prod
