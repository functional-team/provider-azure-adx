# The target table and the function the update query calls. Kusto validates
# both when the policy is set, so the example carries its own prerequisites.
apiVersion: adx.functional.team/v1alpha1
kind: Table
metadata:
  name: parsed-events
  namespace: data-platform
  annotations:
    crossplane.io/external-name: ParsedEvents
spec:
  forProvider:
    database: Telemetry
    columns:
      - name: Timestamp
        type: datetime
      - name: DeviceId
        type: string
      - name: Level
        type: string
    folder: Parsing
    docstring: Rows the update policy derives from RawEvents
  providerConfigRef:
    kind: ProviderConfig
    name: telemetry-prod
---
# The function must return exactly the target table's schema, otherwise Kusto
# rejects the update policy.
apiVersion: adx.functional.team/v1alpha1
kind: Function
metadata:
  name: parse-raw-events
  namespace: data-platform
  annotations:
    crossplane.io/external-name: ParseRawEvents
    # Changes the KQL body and checks that the change reaches the cluster and
    # is then left alone. Kusto rewrites the body, so this cannot be a string
    # comparison -- see the script.
    uptest.upbound.io/post-assert-hook: ../../test/e2e/assert-kql-update.sh
spec:
  forProvider:
    database: Telemetry
    body: |
      RawEvents
      | project Timestamp, DeviceId, Level = tostring(Payload.level)
    folder: Parsing
    docstring: Projects RawEvents onto the ParsedEvents schema
  providerConfigRef:
    kind: ProviderConfig
    name: telemetry-prod
---
apiVersion: policy.adx.functional.team/v1alpha1
kind: UpdatePolicy
metadata:
  name: parsed-events-update
  namespace: data-platform
spec:
  forProvider:
    database: Telemetry
    entity:
      kind: Table
      name: ParsedEvents
    updates:
      - source: RawEvents
        sourceRef:
          name: raw-events
        query: ParseRawEvents()
        transactional: false
        propagateIngestionProperties: false
  providerConfigRef:
    kind: ProviderConfig
    name: telemetry-prod
