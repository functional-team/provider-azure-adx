apiVersion: adx.functional.team/v1alpha1
kind: Table
metadata:
  name: raw-events
  namespace: data-platform
  annotations:
    # The Kusto name. Alternatively set spec.forProvider.name; metadata.name is
    # only the fallback and is usually not a valid PascalCase Kusto name.
    crossplane.io/external-name: RawEvents
    # Not uptest's own update step: its template patches without --namespace
    # while every managed resource here is namespaced, so the patch never
    # finds the object and its retry loop spins until the timeout
    # (run 34452246023). This hook does the same job and works.
    uptest.upbound.io/post-assert-hook: ../../test/e2e/assert-table-update.sh
spec:
  forProvider:
    database: Telemetry
    columns:
      - name: Timestamp
        type: datetime
      - name: DeviceId
        type: string
        docstring: Device that produced the event
      - name: Payload
        type: dynamic
        docstring: Raw JSON body
    folder: Raw
    docstring: Landing table for device events
    # Merge (default) only adds columns; Replace drops columns missing from the
    # spec together with their data.
    schemaUpdateMode: Merge
  providerConfigRef:
    kind: ProviderConfig
    name: telemetry-prod
